# Priyanshu HA lab — full local stack (NOT production)
# Ports: app LB 18088 | PG "46" 54346 | PG "68" 54368 | VIP mock 18080

services:
  app46:
    image: nginx:alpine
    volumes:
      - ./apps/app46.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ha-lab

  app68:
    image: nginx:alpine
    volumes:
      - ./apps/app68.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ha-lab

  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "18088:8088"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - app46
      - app68
    networks:
      - ha-lab

  vip-mock:
    image: nginx:alpine
    ports:
      - "18080:80"
    volumes:
      - ./apps/vip-mock.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ha-lab

  pg46:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: labpass
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - hot_standby=on
      - -c
      - listen_addresses=*
    volumes:
      - pg46-data:/var/lib/postgresql/data
      - ./postgres/primary-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "54346:5432"
    networks:
      - ha-lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  pg68:
    build:
      context: ./postgres
      dockerfile: standby.Dockerfile
    environment:
      POSTGRES_PASSWORD: labpass
      POSTGRES_HOST_AUTH_METHOD: trust
      PRIMARY_HOST: pg46
    volumes:
      - pg68-data:/var/lib/postgresql/data
    ports:
      - "54368:5432"
    depends_on:
      pg46:
        condition: service_healthy
    networks:
      - ha-lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pg46-data:
  pg68-data:

networks:
  ha-lab:
    driver: bridge
