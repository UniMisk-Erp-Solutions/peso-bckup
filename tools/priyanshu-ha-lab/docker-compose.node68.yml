# ISOLATED HA lab on .68 — standby + app + HAProxy (lab ports only).
name: pesowise-ha-lab-68

services:
  app68:
    image: nginx:alpine
    container_name: pesowise-ha-lab-app68
    volumes:
      - ./apps/app68.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ha-lab-68

  haproxy:
    image: haproxy:2.9-alpine
    container_name: pesowise-ha-lab-haproxy
    ports:
      - "18088:8088"
    volumes:
      - ./haproxy/haproxy-remote.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - app68
    networks:
      - ha-lab-68

  pg68:
    build:
      context: ./postgres
      dockerfile: standby.Dockerfile
    container_name: pesowise-ha-lab-pg68
    environment:
      POSTGRES_PASSWORD: labpass
      POSTGRES_HOST_AUTH_METHOD: trust
      PRIMARY_HOST: "${LAB_PG_PRIMARY_HOST:-192.168.23.46}"
      PRIMARY_PORT: "54346"
    volumes:
      - pesowise-ha-lab-pg68-data:/var/lib/postgresql/data
    ports:
      - "54368:5432"
    networks:
      - ha-lab-68
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  pesowise-ha-lab-pg68-data:

networks:
  ha-lab-68:
    driver: bridge
