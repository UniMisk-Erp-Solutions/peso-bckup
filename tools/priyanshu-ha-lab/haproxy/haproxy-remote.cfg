global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend fe_app
  bind *:8088
  default_backend be_app

backend be_app
  balance leastconn
  option httpchk GET /health
  http-check expect status 200
  server app46 192.168.23.46:18046 check inter 3s fall 2 rise 2
  server app68 app68:80 check inter 3s fall 2 rise 2
