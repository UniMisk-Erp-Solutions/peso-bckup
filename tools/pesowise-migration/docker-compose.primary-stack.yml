# Final PesoWise stack names (same volumes as migration v2 — copy migration, not move).
name: pesowise-primary

networks:
  pesowise_migration_internal:
    external: true
    name: pesowise_migration_internal

volumes:
  pesowise_postgres_migration_v2_data:
    external: true
    name: pesowise_postgres_migration_v2_data
  pesowise_minio_migration_v2_data:
    external: true
    name: pesowise_minio_migration_v2_data

services:
  postgres:
    container_name: pesowise-primary-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - /tmp/pesowise-migration-v2/.env
    environment:
      POSTGRES_DB: pesowise
      POSTGRES_USER: pesowise_migration
    volumes:
      - pesowise_postgres_migration_v2_data:/var/lib/postgresql/data
      - /tmp/pesowise-migration-backup/wal-archive-v2:/wal_archive
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesowise_migration -d pesowise"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      coolify.projectName: pesowise
      coolify.name: pesowise-primary-postgres
    networks:
      - pesowise_migration_internal

  minio:
    container_name: pesowise-minio
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - /tmp/pesowise-migration-v2-minio/.env
    environment:
      MINIO_ROOT_USER: pesowise_migration
    volumes:
      - pesowise_minio_migration_v2_data:/data
    ports:
      - "127.0.0.1:19002:9000"
      - "127.0.0.1:19003:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      coolify.projectName: pesowise
      coolify.name: pesowise-minio
    networks:
      - pesowise_migration_internal
