      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PesoWise",
      "alternateName": ["PesoWise by Unimisk", "pesowise.unimisk.com"],
      "url": "https://pesowise.unimisk.com/"

      <meta itemprop="alternateName" content="PesoWise by Unimisk" />
